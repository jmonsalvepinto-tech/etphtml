<!doctype html>
<html><head><meta charset="utf-8">
<title>GPA · Propuesta ETB</title>
<style>
/* Same visual language as the Torre de Control cartelera: dark stage 1920x1080, gold accent, big numbers, presenter-driven */
:root{--bg:#0a0a0a;--card:#171717;--line:#393939;--txt:#f4f4f4;--muted:#a9a9a9;--gold:#d9aa4f;--green:#72c59a;--red:#df7d72;--blue:#7aa7d9;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden;--acc:var(--gold);--acc2:#8a6a28}
#stage.s-co{--acc:var(--blue);--acc2:#3d5e85}
#stage.s-fu{--acc:var(--green);--acc2:#3f7d5b}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 45%),radial-gradient(circle at 80% 75%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 45%);animation:drift 18s ease-in-out infinite alternate;transition:background 1s}
@keyframes drift{to{transform:scale(1.25) translate(40px,-30px)}}
header{position:absolute;top:22px;left:60px;right:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:2}
header .lg{height:84px;width:auto;transition:opacity .6s}.home header .lg,.home .dt{opacity:0}
#sec{display:flex;align-items:center;justify-content:center;gap:16px;letter-spacing:.22em;font-size:22px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
#segDot{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc);flex:none}
#segName{color:var(--acc);font-weight:700}
#slName{font-style:normal;color:var(--muted)}#slName:not(:empty)::before{content:"·";margin-right:16px;color:var(--line)}
.dt{text-align:right;line-height:1;transition:opacity .6s}.dt b{display:block;font-size:44px;font-weight:700;letter-spacing:.02em}.dt span{display:block;font-size:22px;color:var(--muted);margin-top:8px;letter-spacing:.12em;text-transform:uppercase}
#m{position:absolute;inset:150px 90px 110px;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1)}
#m.on{opacity:1;transform:none}
.c{width:100%;text-align:center}.w{width:100%}
h3{font-size:62px;font-weight:300;margin:0 0 44px;text-align:left}h3 b{color:var(--acc);font-weight:700}
.lead{font-size:32px;color:var(--muted);margin:-24px 0 36px;text-align:left;line-height:1.4;max-width:1500px}.lead b{color:var(--txt)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}@keyframes rise{from{opacity:0;transform:translateY(40px)}}
/* intro */
.intro{display:grid;grid-template-columns:auto 1fr;gap:100px;align-items:center;text-align:left}
.intro img{width:700px;animation:pop 1.2s both}
.intro .k1{font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);font-weight:700}
.intro h1{font-size:104px;font-weight:700;line-height:1.02;margin:20px 0 26px;animation:rise .9s .1s both}
.intro p{font-size:38px;color:var(--muted);margin:0;line-height:1.35;animation:rise .9s .25s both}
.intro .hint{font-size:24px;margin-top:50px;color:var(--muted);letter-spacing:.1em}
/* segment cover */
.sp{display:grid;grid-template-columns:auto 1fr;gap:90px;align-items:center;width:100%;text-align:left}
.sp .ic{width:380px;height:380px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%);border:2px solid var(--acc);animation:pop 1s both}
.sp .ic svg{width:200px;height:200px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sp .k1{font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.sp h2{font-size:112px;font-weight:700;line-height:1.02;margin:16px 0 26px;color:var(--acc);animation:rise .9s .1s both}
.sp p{font-size:40px;line-height:1.4;margin:0;max-width:1100px;animation:rise .9s .25s both}
/* cards */
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:46px 30px;box-shadow:0 12px 35px rgba(0,0,0,.28);opacity:0;transform:translateY(40px);transition:all .8s}
.go .card{opacity:1;transform:none}.go .card:nth-child(2){transition-delay:.2s}.go .card:nth-child(3){transition-delay:.4s}.go .card:nth-child(4){transition-delay:.6s}
.card .n{font-size:124px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.card .n.a{color:var(--acc)}
.card .l{font-size:28px;color:var(--muted);margin-top:18px;text-transform:uppercase;letter-spacing:.08em;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;justify-content:center}
.chips span,.chips button{font:inherit;font-size:26px;padding:10px 22px;border-radius:30px;border:1px solid var(--line);color:var(--muted);background:transparent}
.chips button{cursor:pointer}.chips .a{border-color:var(--acc);color:var(--acc)}
.chips b{color:var(--txt)}
/* steps */
.st{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}.st.sh{opacity:1;transform:none}
svg .st{transform:none}
/* bars */
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:500px;gap:40px;border-bottom:2px solid var(--line);padding:0 20px;position:relative}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;z-index:1}
.bar i{width:100%;background:linear-gradient(var(--acc),var(--acc2));border-radius:14px 14px 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.bar.hl i{background:linear-gradient(color-mix(in srgb,var(--acc) 70%,#fff),var(--acc));box-shadow:0 0 40px color-mix(in srgb,var(--acc) 45%,transparent)}
.bar.dim i{background:linear-gradient(#5a5a5a,#3a3a3a)}
.bar span{font-size:38px;margin-bottom:12px;font-weight:700}
.lab{display:flex;justify-content:space-between;gap:40px;padding:16px 20px;font-size:30px;color:var(--muted)}.lab div{flex:1;text-align:center}
.ref{position:absolute;left:0;right:0;border-top:3px dashed var(--muted);z-index:0}
.ref em{position:absolute;left:0;top:-40px;font-style:normal;font-size:24px;color:var(--muted)}
/* horizontal */
.h{margin:26px 0}.h .t{display:flex;justify-content:space-between;gap:30px;font-size:38px;margin-bottom:12px}.h .t b{color:var(--acc);font-variant-numeric:tabular-nums}
.tr{height:36px;background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}.tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:20px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.tr i.gy{background:linear-gradient(90deg,#3a3a3a,#6a6a6a)}
.h.me .t span{color:var(--acc);font-weight:700}
/* line chart */
.ln-ch{width:100%;height:auto;overflow:visible}
.ln-ch .gl{stroke:var(--line)}.ln-ch .ax{fill:var(--muted);font-size:26px}
.ln-ch .vl{font-size:30px;font-weight:700}
.ln-ch .ln{fill:none;stroke-width:7;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s cubic-bezier(.2,.8,.2,1)}
.ln-ch .sh .ln,.ln-ch .ln.sh{stroke-dashoffset:0}
.ln-ch .pt{stroke-width:5;fill:var(--bg)}
.lgd{display:flex;gap:40px;font-size:28px;color:var(--muted);margin-top:20px;justify-content:center}
.lgd i{display:inline-block;width:40px;height:7px;border-radius:4px;vertical-align:middle;margin-right:12px}
.two{display:grid;grid-template-columns:1fr 520px;gap:70px;width:100%;align-items:center}
.note{font-size:24px;color:var(--muted);margin-top:24px;text-align:left}
.callout{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:20px;padding:30px 34px;text-align:left;font-size:32px;line-height:1.4}.callout b{color:var(--acc)}
/* rings */
.rings{display:flex;justify-content:space-around;width:100%}
.rg{display:flex;flex-direction:column;align-items:center;gap:20px;width:480px;text-align:center}
.rg .ring{position:relative;width:340px;height:340px}.rg svg{transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:44;transition:stroke-dasharray 1.6s cubic-bezier(.2,.8,.2,1)}
.rg .ct{position:absolute;inset:0;display:grid;place-items:center;font-size:92px;font-weight:700}
.rg h4{font-size:36px;margin:0}.rg p{font-size:26px;color:var(--muted);margin:0}
/* map */
.mp{display:grid;grid-template-columns:540px 1fr;gap:90px;align-items:center;width:100%;text-align:left}
.mp svg{width:540px;height:748px;display:block;overflow:visible}
.dp{stroke:#141414;stroke-width:1.3;cursor:pointer;transition:fill .6s,stroke .4s,opacity .6s}
.dp.no{fill:#262626;cursor:default}.dp.sel{stroke:var(--txt);stroke-width:3.5}
.bub{fill:color-mix(in srgb,var(--acc) 32%,transparent);stroke:var(--acc);stroke-width:1.5;pointer-events:none;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform 1s cubic-bezier(.2,.8,.2,1),fill .5s}
.go .bub{transform:scale(1)}.bub.sel{fill:color-mix(in srgb,var(--acc) 75%,transparent)}
.spot{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:32px 44px;box-shadow:0 12px 35px rgba(0,0,0,.28)}
.spot .rk{font-size:24px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.spot .nm{font-size:62px;font-weight:700;color:var(--acc);margin:6px 0 16px;line-height:1.05}
.spot .g{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.spot .v{font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.spot .l{font-size:24px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.spot .x{font-size:30px;margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.mp .chips{justify-content:flex-start}
.hint2{font-size:22px;color:var(--muted);margin-top:18px}
@keyframes pulse{0%{r:12;opacity:.9}100%{r:46;opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite;fill:none;stroke:var(--gold);stroke-width:4}
.ms{fill:var(--bg);stroke:var(--gold);stroke-width:6}
.mlab{fill:var(--txt);font-size:24px;font-weight:700;paint-order:stroke;stroke:#141414;stroke-width:6px}
.lyr{display:grid;gap:16px;margin-top:26px}
.lyr div{display:flex;align-items:center;gap:20px;font-size:30px;padding:16px 22px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.lyr i{width:26px;height:26px;border-radius:50%;flex:none}
.lyr b{margin-left:auto;font-size:44px;color:var(--acc);font-variant-numeric:tabular-nums}
/* regional */
.rgn{display:grid;grid-template-columns:1fr 640px;gap:70px;align-items:center;width:100%;text-align:left}
.rgn .rw{display:grid;grid-template-columns:300px 1fr 90px;gap:24px;align-items:center;font-size:34px;padding:14px 20px;border-radius:16px;cursor:pointer;border:1px solid transparent;background:none;color:var(--txt);font-family:inherit;text-align:left;width:100%}
.rgn .rw.on{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:var(--acc)}
.stk{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--card)}
.stk i{height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.rgn .rw b{text-align:right;font-variant-numeric:tabular-nums}
/* donut */
.dnut{display:flex;align-items:center;justify-content:center;gap:110px}
.dnut .ring{position:relative;width:500px;height:500px}.dnut svg{transform:rotate(-90deg)}
.dnut circle{fill:none;stroke-width:76;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.dnut .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dnut .ct b{font-size:104px}.dnut .ct em{font-size:26px;color:var(--muted);font-style:normal;letter-spacing:.15em}
.lg2 div{font-size:38px;margin:26px 0;display:flex;align-items:center;gap:22px;text-align:left}.lg2 i{width:30px;height:30px;border-radius:50%;flex:none}.lg2 span{margin-left:auto;padding-left:60px;font-weight:700}
/* pillars */
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%}
.fr button{font:inherit;color:var(--txt);text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:22px;padding:30px 34px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.fr button svg{width:52px;height:52px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fr h4{font-size:36px;margin:0}.fr .tg{font-size:24px;color:var(--acc)}
.fr .more{display:none;font-size:26px;color:var(--muted);line-height:1.4}
.fr button[aria-expanded="true"]{background:color-mix(in srgb,var(--acc) 14%,var(--card))}.fr button[aria-expanded="true"] .more{display:block}
/* impacto */
.rec{display:grid;grid-template-columns:auto 1fr;gap:90px;align-items:center;text-align:left;width:100%}
.rec .bigr{font-size:220px;font-weight:800;line-height:.85;color:var(--acc)}
.rec .lst div{display:flex;gap:30px;font-size:34px;border-top:1px solid var(--line);padding:24px 0;line-height:1.35}.rec .lst div em{font-style:normal;color:var(--acc);font-weight:700}
/* timeline */
.tl{display:flex;align-items:flex-start;margin:20px 0 40px;position:relative;width:100%}
.tl::before{content:"";position:absolute;left:60px;right:60px;top:30px;height:4px;background:var(--line)}
.tl>div{flex:1;position:relative;text-align:center;padding:0 18px}
.tl i{display:block;width:60px;height:60px;border-radius:50%;margin:0 auto 18px;background:var(--card);border:4px solid var(--acc);position:relative;z-index:1}
.tl .on i,.tl .sh i{background:var(--acc);box-shadow:0 0 30px var(--acc)}
.tl b{display:block;font-size:34px}.tl em{display:block;font-style:normal;color:var(--acc);font-size:26px;font-weight:700;margin-bottom:6px}.tl span{font-size:24px;color:var(--muted);line-height:1.35;display:block;margin-top:8px}
.pills{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.pills span{font-size:24px;padding:10px 22px;border-radius:30px;border:1px solid var(--line);color:var(--muted)}
.ans{display:grid;grid-template-columns:440px 1fr;gap:60px;align-items:center;width:100%;text-align:left}
.ans .big{white-space:nowrap;font-size:190px;font-weight:800;line-height:.85;color:var(--acc);font-variant-numeric:tabular-nums}
.ans .sub{font-size:32px;color:var(--muted);margin-top:22px;line-height:1.35}
.ans .sub b{color:var(--txt)}
.ai{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.ai .card{padding:28px 26px;text-align:left}
.ai h4{font-size:27px;margin:0 0 18px;line-height:1.2;min-height:66px}
.ai .rl{font-size:68px;font-weight:700;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.ai .rl small{font-size:26px;color:var(--muted);font-weight:400;margin-left:6px}
.ai .mt{font-size:22px;color:var(--muted);margin:8px 0 16px;text-transform:uppercase;letter-spacing:.06em}
.ai .gg{position:relative;height:14px;border-radius:8px;background:#2a2a2a;overflow:visible}
.ai .gg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.ai .gg em{position:absolute;right:0;top:-8px;bottom:-8px;width:3px;background:var(--muted)}
.ai .ms{font-size:24px;color:var(--muted);margin-top:18px}.ai .ms b{color:var(--txt);font-size:30px}
.yr{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:30px}
.yr div{border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;background:var(--card)}
.yr b{display:block;font-size:46px;color:var(--acc)}.yr span{font-size:24px;color:var(--muted)}
.yr div.lo b{color:var(--txt)}
.eq{display:grid;grid-template-columns:1fr 70px 1fr 70px 1fr 70px 1fr;align-items:center;gap:0}
.eq>i{font-style:normal;font-size:90px;font-weight:300;color:var(--muted);text-align:center}
.nxw{display:grid;grid-template-columns:960px 1fr;gap:50px;align-items:center;width:100%;position:relative;text-align:left}
.nx{width:960px;height:730px;overflow:visible}
.nl{stroke:#d9aa4f;stroke-opacity:.45;stroke-width:3;stroke-dasharray:10 10;animation:dash 1.2s linear infinite}
.nl2{stroke:#7a7a7a;stroke-opacity:.35;stroke-width:2;stroke-dasharray:4 10}
@keyframes dash{to{stroke-dashoffset:-20}}
.pl{fill:#f0c977}.pl2{fill:#7aa7d9}
.hub{fill:#141414;stroke:#d9aa4f;stroke-width:5}
.hglow{animation:breath 3s ease-in-out infinite}@keyframes breath{50%{opacity:.4}}
.hubt{fill:#f4f4f4;font-size:40px;font-weight:800;letter-spacing:.05em;text-anchor:middle}
.hubs{fill:#a9a9a9;font-size:15px;letter-spacing:.12em;text-anchor:middle;text-transform:uppercase}
.nd{cursor:pointer;outline:none}
.ndh{fill:#d9aa4f;fill-opacity:0;transition:fill-opacity .4s}
.nd.sel .ndh,.nd:hover .ndh,.nd:focus-visible .ndh{fill-opacity:.18}
.ndc{fill:#171717;stroke:#d9aa4f;stroke-width:4}
.nd.sel .ndc{fill:#2a2213}
.ndi{fill:none;stroke:#d9aa4f;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ndt{fill:#f4f4f4;font-size:21px;font-weight:700;text-anchor:middle}
.nds{font-size:19px;font-weight:700;text-anchor:middle;letter-spacing:.04em}
.nxk{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.nxk div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.nxk b{display:block;font-size:52px;color:var(--acc);font-variant-numeric:tabular-nums}.nxk span{font-size:21px;color:var(--muted);line-height:1.3;display:block}
.dbtn{margin-top:26px;font:inherit;font-size:26px;font-weight:700;color:#141414;background:var(--acc);border:0;border-radius:40px;padding:16px 30px;cursor:pointer;box-shadow:0 0 30px color-mix(in srgb,var(--acc) 40%,transparent)}
.wa-t{position:absolute;left:300px;bottom:-6px;width:380px;background:#1f2c25;border:1px solid #2f5a42;border-radius:18px;padding:14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.wa-h{font-size:18px;color:#72c59a;font-weight:700;letter-spacing:.06em}.wa-b{font-size:22px;line-height:1.35;margin-top:6px}
#dmw{position:absolute;inset:-20px -10px;display:none;z-index:5}#dmw.on{display:block}
.dm{width:100%;height:100%;background:#101010;border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.7);padding:26px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;opacity:0;transform:scale(.96);transition:all .5s cubic-bezier(.2,.8,.2,1)}
.dm.go{opacity:1;transform:none}
.dtop{display:flex;align-items:center;gap:20px}
.dlogo{font-size:30px;font-weight:800;letter-spacing:.1em;color:var(--acc)}.dlogo span{color:var(--txt);font-weight:400;letter-spacing:0}
.dtag{font-size:18px;color:#141414;background:#d9aa4f;border-radius:20px;padding:6px 14px;font-weight:700}
.dvw{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.dvw button,.dcl,.dsr button{font:inherit;font-size:22px;background:transparent;color:var(--muted);border:0;padding:10px 20px;cursor:pointer}
.dvw button.a{background:var(--acc);color:#141414;font-weight:700}.dvw small{font-size:15px;opacity:.8}
.dcl{border:1px solid var(--line)!important;border-radius:30px;color:var(--txt)!important}
.dsr{display:flex;gap:12px;align-items:center}
.dsr input{font:inherit;font-size:24px;background:#1b1b1b;color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 18px;width:320px;transition:border-color .3s}
.dsr input:focus{outline:none;border-color:var(--acc)}.dsr input.err{border-color:var(--red)}
.dsr [data-go]{background:var(--acc)!important;color:#141414!important;font-weight:700;border-radius:14px}
.dsr .dch{border:1px solid var(--line)!important;border-radius:30px;font-size:19px!important}.dsr .dch.a{border-color:var(--acc)!important;color:var(--acc)}
.dbody{display:grid;grid-template-columns:1fr 470px;gap:24px;flex:1;min-height:0}
.dmain,.dbx{background:#171717;border:1px solid var(--line);border-radius:20px}
.dmain{padding:22px 28px;display:flex;flex-direction:column;gap:14px}
.dhd{display:flex;justify-content:space-between;align-items:flex-start}

}

 return r.filter(x=>(GD.an===0||x.an===GDA[GD.an])&&(!GD.q||(x.c+x.mt+x.n).toUpperCase().includes(GD.q.toUpperCase())))}
function gdView(){const v=GD.v;
 if(v==='casos'){const cs=gdCases(),k=t=>cs.filter(x=>x.al===t).length;const AL={vencido:['Vencido','r'],hoy:['Vence hoy','y'],prox:['Próximo a vencer','y'],dia:['Al día','g']};

   const s=$('#gdSave');if(s)s.onclick=()=>{GD.reg=true;GD.v='casos';GD.q='';GD.an=0;re()};
   const a=$('#gdA');if(a)a.onchange=()=>{GD.an=+a.value;re()};
   const q=$('#gdQ');if(q){q.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){GD.q=q.value;re();setTimeout(()=>{const n=$('#gdQ');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},0)}})}

 r:()=>`<div class="w"><h3>¿Quiénes <b>somos?</b></h3><p style="font-size:23px;max-width:1180px;line-height:1.45;color:var(--muted);margin:8px 0 24px">Somos una firma colombiana de abogados, construida en familia, que acompaña a empresas con soluciones jurídicas, operativas y especializadas.</p><div class="xk3" style="grid-template-columns:1fr 1fr 1fr;gap:18px"><div class="st" data-s="1"><b style="font-size:23px">Nuestros socios</b><span>María Helena Gómez Pineda<br>Gloria Patricia Gómez Pineda<br>Olga Lucía Gómez Pineda<br>Oscar David Gómez Pineda<br>Hernán David Martínez Gómez</span></div><div class="st" data-s="1"><b style="font-size:23px">Verticales de servicio</b><span>Servicios Legales<br>Jurídicos Masivos y Litigio Especializado<br>Operativos Masivos</span></div><div class="st" data-s="1"><b style="font-size:23px">Nuestras sedes</b><span><b>Medellín</b> · Centro Empresarial El Tesoro<br><b>Bogotá</b> · Edificio Profinanzas<br><b>Rionegro</b> · Centro Comercial Córdoba</span></div></div><div class="pills" style="margin-top:24px"><span>Experiencia con empresas del sector real y financiero</span><span>Gestión jurídica con respaldo operativo y tecnológico</span><span>Presencia en tres sedes</span></div></div>`});

/* Orden solicitado por el cliente: portada, quiénes somos, trayectoria, ubicador, necesidad y resto del contenido original sin el slide de 2.650 estudios. */
(()=>{const by=(seg,name)=>S.find(x=>x.seg===seg&&x.name===name);const cover=S.find(x=>x.home);const who=by('ap','Quiénes somos');const years=by('ex','En cifras');const locator=by('ex','Respaldo');const need=by('ne','Lo que entendemos');const rest=S.filter(x=>x!==cover&&x!==who&&x!==years&&x!==locator&&x!==need&&x.name!=='Estudios de títulos');S.splice(0,S.length,...[cover,who,years,locator,need,...rest]);})();


/* ---------- navegación ---------- */
let cur=0,step=0;const segIdx=k=>SEGS.findIndex(s=>s.k===k);
const segsEl=$('#segs');segsEl.innerHTML=SEGS.map((s,i)=>`<button type="button" data-g="${i}" style="--sc:${s.c}"><b>${s.n}</b><span><i></i></span></button>`).join('');
$$('#segs button').forEach(b=>b.onclick=()=>{const k=SEGS[+b.dataset.g].k;go(S.findIndex(s=>s.seg===k),0)});
void(()=>{const it=['<span><b>260</b> casos de Procesos Jurídicos asignados desde 2022</span>','<span><b>74%</b> índice de productividad acumulado</span>','<span><b>213</b> juzgados atendidos</span>','<span><b>192</b> Cobros Coactivos en un año</span>','<span><b>$4.871 millones</b> en embargos bajo gestión</span>','<span><b>150</b> municipios con cobertura de Torre de Control</span>','<span><b>ISO 9001:2015</b> certificada</span>'].join('');return it+it})();
function applySteps(){$$('.st',m).forEach(e=>e.classList.toggle('sh',(+e.dataset.s||0)<=step));
 $$('.st.sh .ln',m).forEach(p=>p.classList.add('sh'));$$('.st:not(.sh) .ln',m).forEach(p=>p.classList.remove('sh'));
 $$('.st.sh circle[data-da]',m).forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.da));
 $$('.st.sh [data-n]',m).forEach(n=>{if(!n.dataset.done){n.dataset.done=1;count(n.parentNode)}});}
function ui(){const s=S[cur],g=segIdx(s.seg);stage.className=(s.home?'home ':'')+'s-'+s.seg+(EDIT?' editing':'');
 $('#segName').textContent=SEGS[g].n;$('#slName').textContent=s.name||'';
 $$('#segs button').forEach((b,i)=>{b.classList.toggle('a',i===g);const all=S.filter(x=>x.seg===SEGS[i].k),pos=S.filter((x,j)=>x.seg===SEGS[i].k&&j<=cur).length;b.querySelector('i').style.width=(i<g?100:i>g?0:pos/all.length*100)+'%'});
 $('#bar').style.width=((cur+(s.steps?step/s.steps:1))/S.length*100)+'%';
 $('#tag').innerHTML='<kbd>N</kbd> notas';$('#pg').textContent=String(cur+1).padStart(2,'0')+' / '+S.length;
 if(document.activeElement!==$('#notesT'))$('#notesT').textContent=notesTxt();armNotes();try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}}
let tmr;
function go(i,st){clearInterval(window.__sub);i=Math.max(0,Math.min(S.length-1,i));cur=i;const s=S[i];step=st==='end'?s.steps:0;clearTimeout(tmr);tipOff();
 m.classList.remove('on','go');tmr=setTimeout(()=>{m.innerHTML=s.r();applyOv(s);
  $$('.st [data-n]',m).forEach(n=>n.dataset.skip=1);
  ui();void m.offsetWidth;m.classList.add('on');
  setTimeout(()=>{m.classList.add('go');
   $$('[data-h]',m).forEach(e=>e.style.height=e.dataset.h+'%');$$('[data-w]',m).forEach(e=>e.style.width=e.dataset.w+'%');
   $$('.ln-ch > g:not(.st) .ln, .ln-ch .ln.sh',m).forEach(p=>p.classList.add('sh'));
   $$('[data-n]',m).forEach(n=>{if(!n.closest('.st'))count(n.parentNode===m?m:n.parentNode)});
   animRings(m);applySteps();},RM?0:120);
  bindTips(m);if(s.after)s.after();},RM?0:350);ui();}
function next(){const s=S[cur];if(step<s.steps){step++;applySteps();ui()}else if(cur<S.length-1)go(cur+1,0)}
function prev(){if(step>0){step--;applySteps();ui()}else if(cur>0)go(cur-1,'end')}
function notes(){const n=$('#notes');n.hidden=!n.hidden;$('#bNotes').setAttribute('aria-pressed',!n.hidden);$('#eNotes').setAttribute('aria-pressed',!n.hidden);if(!n.hidden&&EDIT)setTimeout(()=>$('#notesT').focus(),50)}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
$('#bEdit').onclick=()=>{EDIT=!EDIT;edUI();rerender()};$('#bEdOff').onclick=()=>{if(Object.keys(PEND).length&&!$('#bEdOff').dataset.sure){$('#bEdOff').dataset.sure=1;$('#bEdOff').textContent='Salir sin guardar';setTimeout(()=>{delete $('#bEdOff').dataset.sure;$('#bEdOff').textContent='Salir'},3000);return}PEND={};EDIT=false;edUI();rerender()};
$('#bDisc').onclick=()=>{PEND={};edUI();rerender()};$('#bSave').onclick=()=>saveState();$('#ePrev').onclick=()=>{if(cur>0)go(cur-1,'end')};$('#eNext').onclick=()=>{if(cur<S.length-1)go(cur+1,'end')};
$('#bReset').onclick=()=>{const p=S[cur].id+'#';Object.keys(PEND).forEach(k=>{if(k.startsWith(p))delete PEND[k]});Object.keys(ST.ov).forEach(k=>{if(k.startsWith(p)&&ST.ov[k]!=null)PEND[k]=null});rerender();edUI();toast('Diapositiva restablecida. Guarda para que el cambio quede.')};
$('#bUp').onclick=openUp;
$('#bNext').onclick=next;$('#bPrev').onclick=prev;(()=>{const a=$('#notes'),h=$('#notesH');let sx,sy,ox=0,oy=0,dx=0,dy=0,dr=false;h.title='Arrastra para mover';h.addEventListener('pointerdown',e=>{dr=true;sx=e.clientX;sy=e.clientY;ox=dx;oy=dy;h.setPointerCapture(e.pointerId);e.preventDefault()});h.addEventListener('pointermove',e=>{if(!dr)return;const k=stage.getBoundingClientRect().width/1920||1;dx=ox+(e.clientX-sx)/k;dy=oy+(e.clientY-sy)/k;a.style.transform=`translate(${dx}px,${dy}px)`});h.addEventListener('pointerup',()=>dr=false)})();
$('#bNotes').onclick=notes;$('#eNotes').onclick=notes;$('#bFs').onclick=fs;
addEventListener('keydown',e=>{const tg=(e.target.tagName||'');if(tg==='INPUT'||e.target.isContentEditable)return;const onB=tg==='BUTTON'||e.target.classList&&e.target.classList.contains('nd');
 if(e.key==='ArrowRight'||e.key==='PageDown'||((e.key===' '||e.key==='Enter')&&!onB)){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
 else if(e.key==='Home')go(0,0);else if(e.key==='End')go(S.length-1,'end');
 else if(e.key==='n'||e.key==='N')notes();else if(e.key==='f'||e.key==='F')fs();});
let mv;addEventListener('mousemove',()=>{stage.classList.add('mov');document.body.classList.add('mov');clearTimeout(mv);mv=setTimeout(()=>document.body.classList.remove('mov'),2500)});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)(d<0?next:prev)();tx=null});
const h=/^#s(\d+)$/.exec(location.hash);go(h?+h[1]-1:0,0);
})();
</script></body></html>
